{% extends "base.html" %}

{% block title %}
Home
{% endblock %}


{% block content %}

<div class="container">

    <div class="card">

        <h1>
            Welcome, {{ user.name }}!
        </h1>


        <p>
            You have successfully authenticated.
        </p>


        <hr>


        <p>
            <strong>Email:</strong>
            {{ user.email }}
        </p>


        <p>
            <strong>Mobile:</strong>
            {{ user.mobile }}
        </p>


        <p>
            <strong>Two-Factor Authentication:</strong>
            Enabled
        </p>


        <br>


        <a href="{% url 'logout' %}">
            Logout
        </a>

    </div>

</div>

{% endblock %}

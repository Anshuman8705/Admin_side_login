<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Project835
        {% endblock %}
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .navbar {
            background: #111827;
            color: white;
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .container {
            max-width: 500px;
            margin: 60px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            color: #dc2626;
            margin-bottom: 15px;
        }

        .success {
            color: #16a34a;
            margin-bottom: 15px;
        }

        .qr {
            text-align: center;
            margin: 25px 0;
        }

        .qr img {
            width: 250px;
            height: 250px;
        }

        .secret {
            background: #f3f4f6;
            padding: 12px;
            word-break: break-all;
            text-align: center;
            border-radius: 6px;
        }

        .recovery {
            background: #fef3c7;
            padding: 20px;
            border-radius: 8px;
        }

        .recovery code {
            display: block;
            margin: 5px 0;
            font-size: 16px;
        }

        .center {
            text-align: center;
        }

    </style>

</head>


<body>

    {% if user.is_authenticated %}

    <div class="navbar">

        <strong>
            Project835
        </strong>

        <div>

            <a href="/home/">
                Home
            </a>

            <a href="/accounts/logout/">
                Logout
            </a>

        </div>

    </div>

    {% endif %}


    {% if messages %}

        {% for message in messages %}

            <div class="container">

                <div class="{{ message.tags }}">

                    {{ message }}

                </div>

            </div>

        {% endfor %}

    {% endif %}


    {% block content %}

    {% endblock %}

</body>

</html>
